<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: 100%;
    height: auto;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="container-fluid background" style="padding-top: 8%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body shadow-lg grad">
          <form name="assetForm">
            <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Add API LOg' | translate }}
            </h2>
            <h2 *ngIf="form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Update API Log' | translate }}
            </h2>

            <!-- Form error messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>
            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Name Field with Validation -->

            <div class="form-group pt-2">
              <label>
                <b>{{ 'API Code' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-user grey-text"></i></div>
                </div>

                <input type="text" name="apiCode" [(ngModel)]="form.data.apiCode" class="form-control"
                  placeholder="{{ 'Enter apiCode' | translate }}">
              </div>

              <span *ngIf="form.inputerror.apiCode" class="alertRedColor">{{ form.inputerror.apiCode }}</span>
            </div>

            <div class="form-group pt-2">
              <label>
                <b>{{ 'API Name' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-user grey-text"></i></div>
                </div>

                <input type="text" name="apiName" [(ngModel)]="form.data.apiName" class="form-control"
                  placeholder="{{ 'Enter apiName' | translate }}">
              </div>

              <span *ngIf="form.inputerror.apiName" class="alertRedColor">{{ form.inputerror.apiName }}</span>
            </div>

            <div class="form-group pt-2">
              <span class="pt-2"><b>{{'Requset Time' | translate }}</b>
                <span class="required-field"></span></span>
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-table grey-text"></i> </div>
                </div>
                <input type="date" name="requestTime" [value]="form.data.requestTime | date:'yyyy-MM-dd'"
                  (input)="form.data.requestTime=parseDate($event.target.value)" class="form-control" required />
              </div>
              <span *ngIf="form.inputerror.requestTime != null" class="alertRedColor" style=" color: red;"> {{
                form.inputerror.requestTime }} </span>
              <!-- <span class="alertRedColor"> {{form.inputerror.dob}} </span> -->
            </div>


            <div class="form-group pt-2">
              <label><b>{{ 'Response Status' | translate }}</b><span class="required-field">*</span></label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-paint-brush grey-text"></i></div>
                </div>

                <select class="form-control" name="responseStatus" [(ngModel)]="form.data.responseStatus"
                  aria-label="ngSelected" required>
                  <option [ngValue]="undefined">{{ 'Select Response Status' | translate }}</option>
                  <option value="200 OK">{{'200 OK' | translate }} </option>
                  <option value="201 Created">{{'201 Created' | translate }} </option>
                  <option value="202 Accepted">{{'202 Accepted' | translate }} </option>
                  <option value="401 Unauthorized">{{'401 Unauthorized' | translate }} </option>
                  <option value="404 Not Found">{{'404 Not Found' | translate }} </option>
                  <option value="500 Internal Server Error">{{'500 Internal Server Error' | translate }} </option>
                  <option value="503 Service Unavailable">{{'503 Service Unavailable' | translate }} </option>
                </select>
              </div>
              <span *ngIf="form.inputerror?.deliveryStatus" class="alertRedColor">{{ form.inputerror.deliveryStatus
                }}</span>
            </div>

            <div class="row pt-2 pl-2 pb-3">

              <div class="col-md-3"></div>

              <div class="pt-2">
                <button *ngIf="!form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Save' | translate }}
                </button>
              </div>

              <div class="col-md-1"></div>

              <div class="pt-2">
                <button *ngIf="form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Update' | translate }}
                </button>
              </div>

              <div class="pt-2">
                <a class="btn btn-warning mr-1" type="button" [routerLink]="['/apiloglist']"
                  style="text-decoration: none; color: white;">
                  {{ 'List' | translate }}
                </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
