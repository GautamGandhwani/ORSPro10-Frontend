<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: 100%;
    height: auto;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="container-fluid background" style="padding-top: 8%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body shadow-lg grad">
          <form name="assetForm">
            <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Add Complaint' | translate }}
            </h2>
            <h2 *ngIf="form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Update Complaint' | translate }}
            </h2>

            <!-- Form error messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>
            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Name Field with Validation -->

            <div class="form-group pt-2">
              <label>
                <b>{{ 'Complaint Code' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-user grey-text"></i></div>
                </div>

                <input type="text" name="complaintCode" [(ngModel)]="form.data.complaintCode" class="form-control"
                  placeholder="{{ 'Enter complaintCode' | translate }}">
              </div>

              <span *ngIf="form.inputerror.complaintCode" class="alertRedColor">{{ form.inputerror.complaintCode
                }}</span>
            </div>

            <div class="form-group pt-2">
              <label>
                <b>{{ 'Complaint Title' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-user grey-text"></i></div>
                </div>

                <input type="text" name="complaintTitle" [(ngModel)]="form.data.complaintTitle" class="form-control"
                  placeholder="{{ 'Enter complaintTitle' | translate }}">
              </div>

              <span *ngIf="form.inputerror.complaintTitle" class="alertRedColor">{{ form.inputerror.complaintTitle
                }}</span>
            </div>

           <div class="form-group pt-2">
              <label>
                <b>{{ 'Raised By' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-user grey-text"></i></div>
                </div>

                <input type="text" name="raisedBy" [(ngModel)]="form.data.raisedBy" class="form-control"
                  placeholder="{{ 'Enter raisedBy' | translate }}">
              </div>

              <span *ngIf="form.inputerror.raisedBy" class="alertRedColor">{{ form.inputerror.raisedBy
                }}</span>
            </div>


            <div class="form-group pt-2">
              <label><b>{{ 'Complaint Status' | translate }}</b><span class="required-field">*</span></label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-paint-brush grey-text"></i></div>
                </div>

                <select class="form-control" name="complaintStatus" [(ngModel)]="form.data.complaintStatus"
                  aria-label="ngSelected" required>
                  <option [ngValue]="undefined">{{ 'Select Complaint Status' | translate }}</option>
                  <option value="Active">{{'Active' | translate }} </option>
                  <option value="Inactive">{{'Inactive' | translate }} </option>
                </select>
              </div>
              <span *ngIf="form.inputerror?.complaintStatus" class="alertRedColor">{{ form.inputerror.complaintStatus }}</span>
            </div>

            <div class="row pt-2 pl-2 pb-3">

              <div class="col-md-3"></div>

              <div class="pt-2">
                <button *ngIf="!form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Save' | translate }}
                </button>
              </div>

              <div class="col-md-1"></div>

              <div class="pt-2">
                <button *ngIf="form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Update' | translate }}
                </button>
              </div>

              <div class="pt-2">
                <a class="btn btn-warning mr-1" type="button" [routerLink]="['/complaintlist']"
                  style="text-decoration: none; color: white;">
                  {{ 'List' | translate }}
                </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
